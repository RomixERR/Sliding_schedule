<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь скользящих смен</title>
<style>
:root{
  --bg:#f2f4f7;
  --grid:#c9d1da;
  --ink:#1f2933;
  --red:#d32f2f;
  --weekend:#fdf2f2;
  --dateH:36px;      /* высота строки с датой          */
  --shiftH:78px;     /* высота строки одной смены      */
  --imgH:46px;       /* размер фото смены              */
  --endH:36px;       /* размер картинки "выхода"       */
}
*{box-sizing:border-box}
body{
  margin:0; padding:18px 14px 34px;
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
h1{font-size:22px;margin:0 0 14px}

/* ---------------- панель выбора месяца и года ---------------- */
.nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.nav button{
  font-size:22px;line-height:1;padding:8px 15px;border:1px solid #99a5b1;
  background:#fff;border-radius:8px;cursor:pointer;min-width:46px;color:var(--ink)
}
.nav button:hover{background:#e8eef5}
.nav button:active{transform:translateY(1px)}
.nav .label{font-size:22px;font-weight:600;min-width:190px;text-align:center}
.nav .label.year{min-width:90px}
.nav .today-btn{font-size:15px;padding:7px 14px;background:#dfe8f2}

/* ---------------- календарь ---------------- */
#cal{border-collapse:collapse;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);table-layout:fixed}
#cal col{width:152px}
#cal th{
  border:1px solid var(--grid);padding:9px 4px;background:#eef2f6;
  font-size:15px;text-transform:uppercase;letter-spacing:.5px
}
#cal th.we{color:var(--red)}
#cal td{border:1px solid var(--grid);padding:0;vertical-align:top;overflow:hidden}

/* ячейка = 5 частей сверху вниз: дата + по одной строке на каждую смену */
.part{border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;gap:4px}
.part:last-child{border-bottom:none}
.part.date{height:var(--dateH);background:#f7f9fb;font-size:21px;font-weight:700}
.part.shift{height:var(--shiftH);padding:3px 2px}
td.we .part.date{background:var(--weekend)}
td.we .part.shift{background:#fff8f8}

.date .num{padding-top:2px}
.date .num.other{color:#b6bec7;font-weight:400}
.date .num.today{color:var(--red)}

/* фото смены + её имя */
.smena{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:var(--imgH);max-width:100%}
.smena img, .smena .ph{
  width:var(--imgH);height:var(--imgH);border-radius:6px;object-fit:cover;border:1px solid #b9c2cc
}
.smena .ph{
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  background:var(--pc,#e4e9ef);color:#243447
}
.smena .ph.empty{background:transparent;border:1px dashed #d7dde3}
.smena .name{
  font-size:12.5px;line-height:1.15;margin-top:3px;font-weight:600;color:#2f3b48;
  max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}

/* картинка "выхода смены" */
.skind{display:flex;align-items:center;justify-content:center}
.skind img, .skind .ic{height:var(--endH);width:auto;min-width:var(--endH);border-radius:4px;object-fit:cover}
.skind .ic{
  padding:0 6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;background:var(--c,#eee);border:1px solid rgba(0,0,0,.18)
}
.skind .none{display:block;width:26px;height:26px;border:1px dashed #e2e6ea;border-radius:4px}
.part.shift.emptyrow{opacity:.35}

/* сегодняшний день — заметная красная рамка по всей ячейке */
td.today{
  box-shadow:inset 0 0 0 3px var(--red), inset 0 0 14px rgba(211,47,47,.18);
  outline:2px solid var(--red);outline-offset:-4px;background:#fff4f4;position:relative;z-index:2
}
td.today .part{border-bottom-color:#efb3b3}
.date .num.today{
  color:#fff;background:var(--red);border-radius:7px;padding:2px 9px;
  box-shadow:0 1px 4px rgba(211,47,47,.45)
}

/* ---------------- легенда и подвал ---------------- */
#legend{
  margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  background:#fff;border:1px solid var(--grid);border-radius:10px;padding:12px 16px;max-width:960px
}
#legend .item{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.25}
#legend img,#legend .ph,#legend .ic{width:32px;height:32px;border-radius:5px;object-fit:cover;border:1px solid #b9c2cc}
#legend .ph{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--pc,#e4e9ef)}
#legend .ic{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;background:var(--c,#eee)}
#legend small{color:#5b6774}
#todayLine{margin-top:14px;font-size:18px;font-weight:600}
#hint{margin-top:8px;font-size:12px;color:#6b7785;max-width:960px;text-align:center}
#credit{margin-top:8px;font-size:14px;color:#4a5866;max-width:960px;text-align:center}
@media (max-width:1120px){
  #cal col{width:128px}
  :root{--imgH:38px;--shiftH:66px;--endH:30px;--dateH:32px}
  .smena .name{font-size:11px;max-width:96px}
}
</style>
</head>
<body>

<h1>Календарь скользящих смен</h1>

<div class="nav">
  <button id="prevMonth" title="Предыдущий месяц">&#8249;</button>
  <div class="label" id="monthLabel">Месяц</div>
  <button id="nextMonth" title="Следующий месяц">&#8250;</button>

  <button id="prevYear" title="Предыдущий год">&#8249;</button>
  <div class="label year" id="yearLabel">Год</div>
  <button id="nextYear" title="Следующий год">&#8250;</button>

  <button class="today-btn" id="todayBtn">Сегодня</button>
</div>

<table id="cal"></table>

<div id="legend"></div>
<div id="todayLine"></div>
<div id="hint">Стрелки слева и справа меняют месяц и год (&#8592; &#8594; тоже работают). Все настройки смен, выходов и картинок — в файле config.js</div>
<div id="credit">Создатель сего чуда — <b>Qwen3.8-Flash-Next IQ3_XXL</b> &nbsp;·&nbsp; автор идеи — <b>RomixERR</b></div>

<script src="config.js"></script>
<script>
"use strict";

/* ---------------- названия ---------------- */
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август",
                "Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WEEK   = ["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];

const ABBR = { "в день":"ДЕНЬ", "в ночь":"НОЧЬ", "отсыпной":"ОТСЫП",
               "выходной":"ВЫХОД", "полдень":"ПОЛДЕНЬ" };

/* ---------------- состояние ---------------- */
const now  = new Date();
let viewY  = now.getFullYear();
let viewM  = now.getMonth();                    /* 0..11 */

const SHIFTS = (CONFIG.shifts || [])
  .slice(0, Math.max(2, Math.min(4, CONFIG.shiftCount || CONFIG.shifts.length)));

/* ---------------- расчёт скользящего графика ---------------- */
function parseStart(str){                       /* "24.10.2026" -> Date UTC */
  const p = str.split(".").map(Number);
  return new Date(Date.UTC(p[2], p[1] - 1, p[0]));
}
function dayDiff(a, b){ return Math.round((b - a) / 86400000); }
function dUTC(y, m, d){ return new Date(Date.UTC(y, m, d)); }

/* Тип выхода смены si на дату dateUTC; null — если смена ещё не началась */
function shiftKind(si, dateUTC){
  const sh    = SHIFTS[si];
  const start = parseStart(sh.start);
  const diff  = dayDiff(start, dateUTC);
  if (diff < 0) return null;
  const n     = sh.cycle > 0 ? sh.cycle : sh.pattern.length;
  const idx   = ((diff % n) + n) % n;
  return sh.pattern[idx] || null;
}

/* ---------------- картинки (если файла нет — цветная плашка с подписью) ---- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function pic(src, alt, kind, fallbackText, fallbackColor){
  const ph = kind === "photo" ? "ph" : "ic";
  const vr = kind === "photo" ? "--pc" : "--c";
  return '<img src="' + esc(src) + '" alt="' + esc(alt) + '" title="' + esc(alt) +
         '" loading="lazy" data-ph="' + ph + '" data-vr="' + vr +
         '" data-fb="' + esc(fallbackText) + '" data-color="' + esc(fallbackColor) + '">';
}

/* вставка плашки вместо недоступной картинки */
function replaceWithPlate(img, scope){
  if (img.dataset.done) return;
  img.dataset.done = "1";
  const span = document.createElement("span");
  span.className = img.dataset.ph;
  span.style.setProperty(img.dataset.vr, img.dataset.color);
  span.textContent = img.dataset.fb;
  span.title = img.getAttribute("title") || "";
  img.replaceWith(span);
}
function fixBrokenImages(scope){
  scope.querySelectorAll("img[data-ph]").forEach(function(img){
    /* уже не загрузилась (ошибка была до навешивания обработчика) */
    if (img.complete && img.naturalWidth === 0) replaceWithPlate(img, scope);
  });
}
function attachImageErrors(scope){
  scope.querySelectorAll("img[data-ph]").forEach(function(img){
    img.addEventListener("error", function(){ replaceWithPlate(img, scope); });
  });
}

/* ---------------- отрисовка календаря ---------------- */
function render(){
  const y = viewY, m = viewM;
  document.getElementById("monthLabel").textContent = MONTHS[m];
  document.getElementById("yearLabel").textContent  = y;

  const offset      = (dUTC(y, m, 1).getUTCDay() + 6) % 7;      /* 0 = ПН */
  const daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const weeks       = Math.ceil((daysInMonth + offset) / 7);     /* строк недель */
  const todayUTC    = dUTC(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  let html = "<colgroup>";
  for (let i = 0; i < 7; i++) html += "<col>";
  html += "</colgroup><thead><tr>";
  for (let i = 0; i < 7; i++)
    html += '<th class="' + (i > 4 ? "we" : "") + '">' + WEEK[i] + "</th>";
  html += "</tr></thead><tbody>";

  for (let w = 0; w < weeks; w++){
    html += "<tr>";
    for (let d = 0; d < 7; d++){
      const num     = w * 7 + d + 1 - offset;
      const t       = dUTC(y, m, num).getTime();
      const inMonth = num >= 1 && num <= daysInMonth;
      const isToday = inMonth && t === todayUTC;
      const isWe    = d > 4;

      let cell = '<td class="' + (isWe ? "we " : "") + (isToday ? "today" : "") + '">';

      /* 1 часть: дата */
      cell += '<div class="part date"><span class="num' +
              (inMonth ? "" : " other") + (isToday ? " today" : "") + '">' +
              (inMonth ? num : "&nbsp;") + "</span></div>";

      /* 2..5 части: по одной строке на каждую смену (фото + выход смены) */
      for (let s = 0; s < 4; s++){
        if (s >= SHIFTS.length){
          /* смен задано меньше четырёх — строка пустая */
          cell += '<div class="part shift emptyrow">' +
                  '<span class="skind"><span class="none"></span></span></div>';
          continue;
        }
        const sh = SHIFTS[s];
        cell += '<div class="part shift">';
        if (inMonth){
          cell += '<span class="smena">' +
                  pic(sh.photo, sh.name, "photo", sh.name.charAt(0) || "?", "#dbe6f2") +
                  '<span class="name" title="' + esc(sh.name) + '">' + esc(sh.name) + "</span></span>";
          const kind = shiftKind(s, dUTC(y, m, num));
          if (kind){
            const tp = CONFIG.shiftTypes[kind] || { name: kind, img: "", color: "#e8e8e8" };
            cell += '<span class="skind">' +
                    pic(tp.img, sh.name + " — " + tp.name, "shift",
                        ABBR[tp.name] || tp.name.slice(0, 5).toUpperCase(), tp.color) +
                    "</span>";
          } else {
            cell += '<span class="skind"><span class="none" title="смена ещё не началась"></span></span>';
          }
        } else {
          cell += '<span class="smena"><span class="ph empty"></span></span>' +
                  '<span class="skind"><span class="none"></span></span>';
        }
        cell += "</div>";
      }

      cell += "</td>";
      html += cell;
    }
    html += "</tr>";
  }
  html += "</tbody>";

  const cal = document.getElementById("cal");
  cal.innerHTML = html;
  attachImageErrors(cal);
  fixBrokenImages(cal);       /* уже не загрузившиеся (кэш/кэш-ошибка) */
}

/* ---------------- легенда ---------------- */
function renderLegend(){
  let html = "";
  SHIFTS.forEach(function(sh){
    html += '<div class="item">' + pic(sh.photo, sh.name, "photo",
             sh.name.charAt(0) || "?", "#dbe6f2") +
             "<span><b>" + esc(sh.name) + "</b><br><small>цикл " + sh.cycle +
             " дн. · старт " + esc(sh.start) + "</small></span></div>";
  });
  for (const key in CONFIG.shiftTypes){
    const t = CONFIG.shiftTypes[key];
    html += '<div class="item">' + pic(t.img, t.name, "shift",
             ABBR[t.name] || t.name.slice(0, 5).toUpperCase(), t.color) +
             "<span>" + esc(t.name) + "</span></div>";
  }
  const box = document.getElementById("legend");
  box.innerHTML = html;
  attachImageErrors(box);
  fixBrokenImages(box);
}

/* ---------------- сегодняшняя дата в подвале ---------------- */
function renderTodayLine(){
  const p = n => String(n).padStart(2, "0");
  document.getElementById("todayLine").textContent =
    "Сегодня: " + p(now.getDate()) + "." + p(now.getMonth() + 1) + "." + now.getFullYear();
}

/* ---------------- навигация (месяц и год: 4 кнопки) ---------------- */
function clampYear(){
  const min = CONFIG.minYear || 1900, max = CONFIG.maxYear || 2100;
  if (viewY < min) viewY = min;
  if (viewY > max) viewY = max;
}
function monthStep(step){
  viewM += step;
  if (viewM < 0)  { viewM = 11; viewY--; }
  if (viewM > 11) { viewM = 0;  viewY++; }
  clampYear(); render();
}
function yearStep(step){ viewY += step; clampYear(); render(); }

document.getElementById("prevMonth").onclick = () => monthStep(-1);
document.getElementById("nextMonth").onclick = () => monthStep(+1);
document.getElementById("prevYear").onclick  = () => yearStep(-1);
document.getElementById("nextYear").onclick  = () => yearStep(+1);
document.getElementById("todayBtn").onclick  = () => {
  viewY = now.getFullYear(); viewM = now.getMonth(); render();
};
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft")  monthStep(-1);
  if (e.key === "ArrowRight") monthStep(+1);
});

/* ---------------- старт: текущий месяц и год ---------------- */
render();
renderLegend();
renderTodayLine();
</script>
</body>
</html>
